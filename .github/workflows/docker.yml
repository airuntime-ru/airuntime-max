name: Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  ORG: ${{ github.repository_owner }}
  REPO: ${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            file: backend/Dockerfile
          - name: frontend
            context: ./frontend
            file: frontend/Dockerfile
          - name: admin
            context: .
            file: admin/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.airuntime.ru/api/v1
            NEXT_PUBLIC_SITE_URL=https://airuntime.ru
            NEXT_PUBLIC_BASE_DOMAIN=airuntime.ru

      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ env.REPO }}/${{ matrix.name }}
        run: |
          set -euo pipefail
          enc="$(printf %s "$PACKAGE" | jq -sRr @uri)"
          put_vis() {
            curl -sS -o /tmp/pkg-vis.json -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/orgs/${ORG}/packages/container/${enc}/visibility" \
              -d '{"visibility":"public"}'
          }
          for i in 1 2 3 4 5 6; do
            code="$(put_vis)"
            echo "visibility attempt $i HTTP $code for $PACKAGE"
            cat /tmp/pkg-vis.json || true
            if [ "$code" = "204" ] || [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Failed to set public visibility" >&2
          exit 1
