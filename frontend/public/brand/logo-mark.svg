    <path d="M83 407c55-78 107-119 158-126 58-7 112 31 166 115-12 34-36 47-65 27-40-29-74-45-103-47-34-3-70 14-109 51-26 24-52 21-47-20Z" fill="url(#airuntime-cross)" opacity=".9"/>
    <path d="M105 397c52-151 88-244 125-289 28-34 60-41 89-28 40 18 74 78 104 177 17 57 28 106 30 128" fill="none" stroke="#1293FF" stroke-opacity=".45" stroke-width="5" stroke-linecap="round"/>
    <path d="M83 407c55-78 107-119 158-126 58-7 112 31 166 115" fill="none" stroke="#2FB7FF" stroke-opacity=".5" stroke-width="4" stroke-linecap="round"/>
