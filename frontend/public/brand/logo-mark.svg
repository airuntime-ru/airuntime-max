<svg xmlns="http://www.w3.org/2000/svg" viewBox="55 45 402 402" fill="none" role="img" aria-label="AIRuntime">
  <style>
    @media (prefers-reduced-motion: no-preference) {
      #airuntime-shine {
        animation: airuntime-shine 7s ease-in-out infinite;
      }
    }
    @keyframes airuntime-shine {
      0% { transform: translateX(-220px); opacity: .3; }
      42% { opacity: .75; }
      70% { transform: translateX(580px); opacity: .2; }
      100% { transform: translateX(580px); opacity: 0; }
    }
  </style>
  <defs>
    <linearGradient id="airuntime-left" x1="110" y1="430" x2="280" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C7B8FF" stop-opacity=".9"/>
      <stop offset=".44" stop-color="#8BDFFF" stop-opacity=".96"/>
      <stop offset="1" stop-color="#1D8CFF" stop-opacity=".88"/>
    </linearGradient>
    <linearGradient id="airuntime-right" x1="238" y1="76" x2="424" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEFBFF" stop-opacity=".96"/>
      <stop offset=".43" stop-color="#50DBE5" stop-opacity=".92"/>
      <stop offset="1" stop-color="#2388FF" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="airuntime-cross" x1="146" y1="330" x2="370" y2="258" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CFC6FF" stop-opacity=".8"/>
      <stop offset=".55" stop-color="#EAF9FF" stop-opacity=".88"/>
      <stop offset="1" stop-color="#14B8D7" stop-opacity=".78"/>
    </linearGradient>
    <linearGradient id="airuntime-shine-gradient" x1="0" y1="0" x2="180" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".78"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="airuntime-glow" x="-18%" y="-18%" width="136%" height="136%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 .14 0 0 0 0 .53 0 0 0 0 1 0 0 0 .35 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
