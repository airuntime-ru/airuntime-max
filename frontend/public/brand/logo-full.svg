    <path id="airuntime-full-shine" d="M20 12h70v180H20z" fill="url(#full-shine-gradient)" opacity=".72"/>
  </g>
  <text x="230" y="135" fill="#081426" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="64" font-weight="650" letter-spacing="17">AIRUNTIME</text>
