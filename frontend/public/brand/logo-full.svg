    <path d="M89 39c13-16 28-20 42-14 18 8 35 35 49 80 8 26 12 47 13 57 1 14-6 23-17 25-9 1-16-4-21-14-8-16-16-29-24-39-15-70-30-101-42-95Z" fill="url(#full-right)" opacity=".8"/>
    <path d="M30 169c24-34 47-52 70-55 25-3 49 14 72 50-5 15-16 21-29 12-17-13-32-20-45-21-15-1-31 6-48 22-12 11-23 9-20-8Z" fill="url(#full-cross)" opacity=".9"/>
