<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 220" fill="none" role="img" aria-label="AIRuntime">
  <style>
    @media (prefers-reduced-motion: no-preference) {
      #airuntime-full-shine { animation: airuntime-full-shine 7s ease-in-out infinite; }
    }
    @keyframes airuntime-full-shine {
      0% { transform: translateX(-120px); opacity: .25; }
      45% { opacity: .75; }
      74% { transform: translateX(320px); opacity: .18; }
      100% { transform: translateX(320px); opacity: 0; }
    }
  </style>
  <defs>
    <linearGradient id="full-left" x1="40" y1="178" x2="118" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C7B8FF" stop-opacity=".9"/>
      <stop offset=".44" stop-color="#8BDFFF" stop-opacity=".96"/>
      <stop offset="1" stop-color="#1D8CFF" stop-opacity=".88"/>
    </linearGradient>
    <linearGradient id="full-right" x1="102" y1="34" x2="184" y2="184" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEFBFF" stop-opacity=".96"/>
      <stop offset=".43" stop-color="#50DBE5" stop-opacity=".92"/>
      <stop offset="1" stop-color="#2388FF" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="full-cross" x1="62" y1="144" x2="164" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CFC6FF" stop-opacity=".8"/>
      <stop offset=".55" stop-color="#EAF9FF" stop-opacity=".88"/>
      <stop offset="1" stop-color="#14B8D7" stop-opacity=".78"/>
    </linearGradient>
    <linearGradient id="full-shine-gradient" x1="0" y1="0" x2="120" y2="0" gradientUnits="userSpaceOnUse">
